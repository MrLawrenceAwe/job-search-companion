<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Search Companion settings</title><link rel="stylesheet" href="options.css"></head>
<body><main>
<h1>Indeed blocker checks</h1>
<section><h2>ChatGPT connection</h2><p id="connection">Loading…</p>
<label>Current account <select id="account" aria-label="Current ChatGPT account"></select></label>
<div class="buttons"><button id="connect">Continue with ChatGPT</button><button id="add">Add account</button><button id="cancel">Cancel sign-in</button><button id="logout">Sign out</button><a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener noreferrer">Manage usage</a></div>
<p><label><input id="accountFallback" type="checkbox" aria-describedby="fallbackStatus"> Use another account when usage runs out</label></p>
<div id="fallbackStatus" class="note" role="status"></div></section>
<section><h2>Checking</h2><label>Model <select id="model" aria-label="Checker model"></select></label><button id="refresh">Refresh models</button>
<p><label><input id="enabled" type="checkbox"> Automatically check selected Indeed jobs</label></p>
<p id="profile" class="note"></p></section>
<button id="save" disabled>Loading settings…</button>
<p id="feedback" role="status" aria-live="polite"></p>
<section><h2>Saved findings</h2><p>Stored locally for up to 30 days.</p><button id="clear">Clear saved findings</button></section>
<p class="note">Checks send job descriptions and relevant profile facts to OpenAI using your ChatGPT plan.</p>
</main><script src="options.js"></script></body></html>
